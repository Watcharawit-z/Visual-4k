# Builds Visual-4k on real Windows runners and publishes downloadable binaries.
#
# This exists because the project was written in a Linux container with no
# Windows SDK and no WDK: until this workflow goes green, nothing here has ever
# been through a compiler. CI is the first real build, and the artifacts it
# produces are what users download instead of installing a toolchain.

name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Tag to create and publish a release for, e.g. v0.1.0.
          Leave empty to build without releasing.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Everything that does not need Windows, run first so a numerics regression
  # fails in 30 seconds instead of after two Windows builds.
  reference:
    name: reference tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install numpy pillow pytest

      - name: Run the reference test suite
        run: python -m pytest reference/tests -q

      - name: Build and run the portable self-tests
        run: |
          cmake -B build -S .
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Type-check the Windows host sources against the stubs
        run: ./tools/check-host-compiles.sh

      # A syntax error in an install script only surfaces when a user runs it,
      # by which point they have already downloaded a release. pwsh parses on
      # Linux, so this costs nothing.
      # Same reasoning as the PowerShell parse below: a malformed XML file
      # fails on a Windows runner minutes later, with an error that names the
      # file and not the line.
      - name: Parse the XML files
        run: python3 tools/check-xml-comments.py

      # The version the driver is compiled for and the version its INF asks
      # Windows to load have to agree, and when they did not the failure was
      # invisible to the build and cost a full install cycle to find.
      - name: Check the driver's declared versions are consistent
        run: python3 tools/check-driver-versions.py

      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem tools -Filter *.ps1 | ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                  Write-Host "FAILED $($_.Name)"
                  $errors | ForEach-Object { Write-Host "  $($_.Message)" }
                  $bad++
              } else {
                  Write-Host "ok     $($_.Name)"
              }
          }
          if ($bad) { throw "$bad script(s) have syntax errors" }

  compositor:
    name: compositor (visual4k-host)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Not optional decoration: this is what lets the tap table parity check
      # run against the binary that is about to be published, rather than
      # being skipped on the one platform that ships it.
      - name: Install numpy for the parity check
        run: pip install numpy

      - name: Configure
        run: cmake -B build -S . -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Run the portable self-tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage the package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "package/visual4k-host"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/host/visual4k-host/Release/visual4k-host.exe $out
          Copy-Item build/installer/visual4k-setup/Release/Visual4k-Setup.exe $out
          Copy-Item -Recurse shaders "$out/shaders"
          Copy-Item build/Release/edid_selftest.exe $out -ErrorAction SilentlyContinue

          # The setup program is the only thing most people will ever run, and
          # a manifest that failed to embed produces an exe that starts without
          # elevation and fails at its first step -- silently, as far as the
          # build is concerned. So the embedded manifest is checked, not
          # assumed.
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path "$out\Visual4k-Setup.exe"))
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -notmatch 'requireAdministrator') {
              throw "Visual4k-Setup.exe has no elevation manifest embedded"
          }
          Write-Host "elevation manifest present"

          Get-ChildItem -Recurse $out | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: visual4k-host
          path: package/visual4k-host
          if-no-files-found: error

  driver:
    name: driver (Visual4kDisplay)
    # Pinned to the VS2022 image on purpose. windows-latest now ships Visual
    # Studio 18, and the WDK's MSBuild integration is distributed as a VSIX
    # built for VS2022 -- on VS18 there is nothing to install, MSBuild quietly
    # falls back to the ordinary C++ toolset, and the build fails much later
    # with "cannot open include file: 'wdf.h'".
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # The WDK is not on the hosted images. Installing it has two parts that
      # are easy to confuse: the kit itself provides the headers and libraries,
      # and a separate VSIX provides the MSBuild platform toolset the project
      # file asks for. Without the VSIX the build fails with an unhelpful
      # "WindowsUserModeDriver10.0 not found".
      - name: Install the Windows Driver Kit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Downloading WDK installer..."
          $installer = "$env:RUNNER_TEMP\wdksetup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2286137" `
                            -OutFile $installer -UseBasicParsing
          Write-Host "Running WDK installer (quiet)..."
          $p = Start-Process -FilePath $installer `
                             -ArgumentList "/quiet","/norestart","/features","+" `
                             -Wait -PassThru
          Write-Host "WDK installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "WDK install failed with $($p.ExitCode)"
          }

      - name: Install the WDK Visual Studio extension
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $all = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Vsix" `
                     -Filter "*.vsix" -Recurse -ErrorAction SilentlyContinue
          if (-not $all) {
            Write-Host "No WDK VSIX under Windows Kits\10\Vsix. Present:"
            Get-ChildItem "C:\Program Files (x86)\Windows Kits\10" -Depth 1 |
                Select-Object FullName
            throw "WDK VSIX not found"
          }
          $all | ForEach-Object { Write-Host "found: $($_.FullName)" }

          # The kit ships one VSIX per host architecture, and sorting the list
          # by name puts arm64 first -- installing that on an x64 runner is
          # what produced VSIXInstaller error 2001.
          $vsix = $all | Where-Object { $_.FullName -match '\\amd64\\' } |
                  Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $vsix) { throw "no amd64 WDK VSIX among the ones found above" }
          Write-Host "installing: $($vsix.FullName)"

          # Locate VS through vswhere rather than a hardcoded year: the hosted
          # images change edition and version without notice, and a glob that
          # silently matches nothing is how this step failed the first time.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio installation" }

          $installer = Join-Path $vsPath "Common7\IDE\VSIXInstaller.exe"
          if (-not (Test-Path $installer)) { throw "VSIXInstaller not at $installer" }
          Write-Host "VS: $vsPath"

          # /logFile captures the real reason behind VSIXInstaller's numeric
          # exit codes, which on their own cannot be acted on.
          $log = "$env:RUNNER_TEMP\vsix.log"
          $p = Start-Process -FilePath $installer `
                             -ArgumentList "/quiet","/admin","/logFile:$log",$vsix.FullName `
                             -Wait -PassThru
          # Deliberately not fatal. VSIXInstaller's exit codes do not
          # distinguish "failed" from "this is already installed", and the
          # windows-2022 image ships the WDK integration preinstalled, so
          # judging the outcome here rejects a perfectly good runner. The
          # next step checks the thing we actually care about -- whether the
          # toolset is registered -- and that is the authority.
          Write-Host "VSIXInstaller exit code: $($p.ExitCode) (informational)"
          Get-ChildItem "$env:RUNNER_TEMP" -Filter "vsix*.log" -ErrorAction SilentlyContinue |
              ForEach-Object {
                  Write-Host "--- $($_.Name) ---"
                  Get-Content $_.FullName -Tail 40
              }


      - name: Verify the driver toolset is present
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The authoritative check, and the reason the VSIX step does not
          # judge its own exit code. Without this, MSBuild falls back to the
          # ordinary C++ toolset and the failure surfaces much later as a
          # missing wdf.h, which sends you looking for the WDK headers
          # instead of the integration.
          # The trailing \* matters. Without it PowerShell returns the
          # PlatformToolsets directory itself rather than the toolsets inside
          # it, and the check reports every toolset as missing.
          $toolsets = Get-ChildItem `
              "C:\Program Files*\Microsoft Visual Studio\*\*\MSBuild\Microsoft\VC\*\Platforms\x64\PlatformToolsets\*" `
              -Directory -ErrorAction SilentlyContinue

          $names = $toolsets | Select-Object -ExpandProperty Name -Unique | Sort-Object
          Write-Host "registered x64 toolsets:"
          $names | ForEach-Object { Write-Host "  $_" }

          if ($names -notcontains "WindowsUserModeDriver10.0") {
            Write-Host ""
            Write-Host "WDK MSBuild files present on disk:"
            Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\build" -Directory `
                -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "WindowsUserModeDriver10.0 toolset is not registered with MSBuild"
          }
          Write-Host ""
          Write-Host "WindowsUserModeDriver10.0 is registered."

      # The previous run proved the toolset is registered yet CL still ran
      # with the ordinary C++ include paths, so ask MSBuild what it actually
      # resolved rather than guessing at the project file again.
      - name: Show what MSBuild resolved
        shell: pwsh
        continue-on-error: true
        run: |
          msbuild driver\Visual4kDisplay\Visual4kDisplay.vcxproj `
                  /p:Configuration=Release /p:Platform=x64 `
                  /getProperty:PlatformToolset `
                  /getProperty:ConfigurationType `
                  /getProperty:DriverType `
                  /getProperty:WDKContentRoot `
                  /getProperty:WindowsTargetPlatformVersion `
                  /getProperty:IncludePath
          Write-Host "--- WDF versions installed ---"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include\wdf\umdf" `
              -Directory -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name
          Write-Host "--- toolset directory contents ---"
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\Platforms\x64\PlatformToolsets\WindowsUserModeDriver10.0" `
              -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name

      - name: Build the driver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # The UMDF version comes from the project file, which matches the
          # INF, and is NOT read off the kit.
          #
          # It used to be. The runner ships UMDF 2.35, so the driver was built
          # and linked against 2.35 while the INF told the loader to bind
          # 2.33.0 -- the identical mistake that was found and fixed for IddCx,
          # left in place here because only one of the two was looked at.
          #
          # The kit does ship the older versions alongside the newest, which is
          # the point of versioning them, so building for 2.33 needs nothing
          # installed beyond what is already here.
          $wdfRoot = "C:\Program Files (x86)\Windows Kits\10\Include\wdf\umdf"
          Write-Host "UMDF versions this kit ships:"
          Get-ChildItem $wdfRoot -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  $($_.Name)" }

          # IddCx is a class extension shipped with the WDK, and where its
          # header lands varies between kits. Locate it rather than assuming
          # the SDK's um directory carries it.
          $kit = "C:\Program Files (x86)\Windows Kits\10"
          $iddcxHeader = Get-ChildItem $kit -Filter "iddcx.h" -Recurse `
                             -ErrorAction SilentlyContinue |
                         Sort-Object FullName -Descending | Select-Object -First 1
          # Search on the stem rather than an exact name: the linker reported
          # LNK1104 for IddCx.lib while WdfDriverStubUm.lib resolved fine, so
          # the file is either named differently or somewhere unexpected.
          $iddcxLibs = Get-ChildItem $kit -Filter "iddcx*.lib" -Recurse `
                           -ErrorAction SilentlyContinue
          Write-Host "IddCx import libraries found under the kit:"
          $iddcxLibs | ForEach-Object { Write-Host "  $($_.FullName)" }

          $iddcxLib = $iddcxLibs |
                      Where-Object { $_.FullName -match '\\x64\\' } |
                      Sort-Object FullName -Descending | Select-Object -First 1

          # The IddCx version comes from the kit, and is written into BOTH the
          # compiler macros and the INF, from this one discovery.
          #
          # Having it in two places was the whole problem. It was hand-written
          # in the INF and discovered here, they disagreed, and the failure was
          # invisible to the build because each half was individually correct.
          # Pinning both by hand fixed that and introduced the opposite fault:
          # the header gates callback tables on the version macros but not data
          # structures, so building for an older extension produces a
          # correctly-shrunk IDD_CX_CLIENT_CONFIG next to a full-size
          # IDDCX_ADAPTER_CAPS, and the class extension refuses the second.
          #
          # One source, stamped into both.
          $iddcxVersionDir = Get-ChildItem "$kit\Include\*\um\iddcx" -Directory `
                                 -ErrorAction SilentlyContinue |
                             Where-Object { $_.Name -match '^(\d+)\.(\d+)$' } |
                             Sort-Object {
                                 $p = $_.Name -split '\.'
                                 [int]$p[0] * 1000 + [int]$p[1]
                             } -Descending | Select-Object -First 1
          if (-not $iddcxVersionDir) { throw "no versioned IddCx directory under $kit" }
          $parts = $iddcxVersionDir.Name -split '\.'
          $iddcxMajor = $parts[0]
          $iddcxMinor = $parts[1]
          Write-Host "IddCx version: $iddcxMajor.$iddcxMinor ($($iddcxVersionDir.FullName))"

          if ($iddcxHeader) {
            Write-Host "iddcx.h: $($iddcxHeader.FullName)"
            $iddcxInclude = $iddcxHeader.DirectoryName
          } else {
            Write-Host "::warning::iddcx.h not found anywhere under $kit"
            $iddcxInclude = ""
          }
          if ($iddcxLib) {
            Write-Host "linking against: $($iddcxLib.FullName)"
            $iddcxLibDir = $iddcxLib.DirectoryName
            $iddcxLibFile = $iddcxLib.FullName
          } else {
            # Failing here beats failing at link time with LNK1104, which says
            # nothing about where the file was looked for.
            throw "no x64 IddCx import library under $kit (see the listing above)"
          }

          # Every build gets its own DriverVer. Without it Windows can keep
          # serving the package already in the store, so an install over a
          # previous version updates nothing and the old binary stays bound.
          python tools\stamp-driverver.py --iddcx "$iddcxMajor.$iddcxMinor"
          if ($LASTEXITCODE -ne 0) { throw "stamping the INF failed" }

          # Checked after stamping, on the files that are about to be built and
          # shipped, rather than on what is committed.
          python tools\check-driver-versions.py
          if ($LASTEXITCODE -ne 0) { throw "the driver's declared versions disagree" }

          msbuild driver\Visual4kDisplay\Visual4kDisplay.vcxproj `
                  /p:Configuration=Release /p:Platform=x64 `
                  "/p:Visual4kIddCxInclude=$iddcxInclude" `
                  "/p:Visual4kIddCxLib=$iddcxLibDir" `
                  "/p:Visual4kIddCxLibFile=$iddcxLibFile" `
                  /p:Visual4kIddCxMajor=$iddcxMajor `
                  /p:Visual4kIddCxMinor=$iddcxMinor `
                  /v:normal /p:SignMode=Off
          if ($LASTEXITCODE -ne 0) { throw "driver build failed" }

          $dll = Get-ChildItem driver/Visual4kDisplay/x64 -Recurse `
                     -Filter Visual4kDisplay.dll -ErrorAction SilentlyContinue
          if (-not $dll) { throw "build reported success but produced no DLL" }
          Write-Host "built: $($dll[0].FullName)"

      - name: Stage and sign the package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Absolute, because inf2cat resolves /driver: against its own
          # working directory rather than the shell's.
          $out = Join-Path (Get-Location) "package/Visual4kDisplay"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Get-ChildItem -Recurse driver/Visual4kDisplay/x64 |
              Where-Object { $_.Extension -in ".dll",".pdb" } |
              ForEach-Object { Copy-Item $_.FullName $out }

          # The INF comes from the source tree, not the build output: we are
          # not using the WDK's packaging target, so nothing copies it for us,
          # and inf2cat rejects a folder with no INF at its root.
          Copy-Item driver/Visual4kDisplay/Visual4kDisplay.inf $out

          Write-Host "staged for signing:"
          Get-ChildItem $out | ForEach-Object { Write-Host "  $($_.Name)" }
          if (-not (Get-ChildItem $out -Filter *.inf)) { throw "no INF staged" }
          if (-not (Get-ChildItem $out -Filter *.dll)) { throw "no DLL staged" }

          # Sign here rather than on the user's machine. inf2cat and signtool
          # ship with the WDK and the SDK, and requiring those to install a
          # release defeats the point of shipping binaries at all.
          #
          # The private key lives only in this job and is never exported; only
          # the public certificate goes into the package, so nothing outside
          # this run can sign anything Windows would then trust.
          # Prefer x64, but fall back to whatever the kit ships: inf2cat.exe is
          # x86-only, so an x64-only filter finds signtool and then reports the
          # WDK as missing.
          function Find-KitTool($name) {
              $all = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter $name `
                         -Recurse -ErrorAction SilentlyContinue
              if (-not $all) { return $null }
              $x64 = $all | Where-Object { $_.FullName -match '\\x64\\' } |
                     Sort-Object FullName -Descending | Select-Object -First 1
              if ($x64) { return $x64 }
              return $all | Sort-Object FullName -Descending | Select-Object -First 1
          }
          $inf2cat = Find-KitTool 'inf2cat.exe'
          $signtool = Find-KitTool 'signtool.exe'
          if (-not $inf2cat) { throw "inf2cat.exe not found" }
          if (-not $signtool) { throw "signtool.exe not found" }

          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
                      -Subject "CN=Visual-4k Build Certificate" `
                      -CertStoreLocation Cert:\CurrentUser\My `
                      -KeyUsage DigitalSignature `
                      -NotAfter (Get-Date).AddYears(5)
          Write-Host "signing certificate thumbprint: $($cert.Thumbprint)"

          & $inf2cat.FullName /driver:$out /os:10_X64 /uselocaltime
          if ($LASTEXITCODE -ne 0) { throw "inf2cat failed" }

          $cat = Join-Path $out 'Visual4kDisplay.cat'
          if (-not (Test-Path $cat)) { throw "inf2cat produced no catalog" }

          foreach ($file in @($cat, (Join-Path $out 'Visual4kDisplay.dll'))) {
              & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint `
                  /t http://timestamp.digicert.com $file
              if ($LASTEXITCODE -ne 0) { throw "signing $file failed" }
          }

          Export-Certificate -Cert $cert `
              -FilePath (Join-Path $out 'Visual4k-Build-Certificate.cer') | Out-Null

          # Informational only. This certificate is deliberately not trusted on
          # the runner, so verify is expected to fail here; it succeeds on a
          # machine that has run install-driver.ps1.
          #
          # Its exit code has to be cleared: a pwsh step exits with the last
          # $LASTEXITCODE, so leaving this one set fails the step after every
          # file has already been signed correctly.
          & $signtool.FullName verify /pa /v $cat
          Write-Host "signtool verify exit code: $LASTEXITCODE (expected non-zero here)"
          $global:LASTEXITCODE = 0

          Write-Host "signed package contents:"
          Get-ChildItem $out | ForEach-Object { Write-Host "  $($_.Name)  $($_.Length)" }

          foreach ($required in 'Visual4kDisplay.dll', 'Visual4kDisplay.inf',
                                'Visual4kDisplay.cat', 'Visual4k-Build-Certificate.cer') {
              if (-not (Test-Path (Join-Path $out $required))) {
                  throw "$required missing from the signed package"
              }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Visual4kDisplay
          path: package/Visual4kDisplay
          if-no-files-found: error

  package:
    name: release package
    runs-on: windows-latest
    needs: [reference, compositor, driver]
    # Two ways in: a pushed tag, or a manual run that names one. The manual
    # path exists because pushing a tag is not always available to whoever is
    # driving the release, and action-gh-release will create the tag itself.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Assemble the release zip
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = "Visual-4k"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item -Recurse staging/visual4k-host/* $root
          New-Item -ItemType Directory -Force -Path "$root/driver" | Out-Null
          Copy-Item -Recurse staging/Visual4kDisplay/* "$root/driver"
          Copy-Item tools/install-driver.ps1, tools/uninstall-driver.ps1 $root
          Copy-Item tools/Install-Visual4k.ps1 $root
          Copy-Item docs/GETTING-STARTED.md, README.md, LICENSE $root

          # The compositor renders black without these, so a zip missing them
          # would be worse than no zip at all.
          if (-not (Test-Path "$root/visual4k-host.exe")) { throw "compositor missing" }
          if (-not (Test-Path "$root/Visual4k-Setup.exe")) { throw "setup program missing" }
          if (-not (Test-Path "$root/shaders")) { throw "shaders missing" }
          if (-not (Get-ChildItem "$root/driver" -Filter *.dll)) { throw "driver DLL missing" }

          # Without these the archive falls back to needing the WDK, which is
          # exactly what shipping binaries is meant to avoid.
          if (-not (Get-ChildItem "$root/driver" -Filter *.cat)) { throw "signed catalog missing" }
          if (-not (Get-ChildItem "$root/driver" -Filter *.cer)) { throw "signing certificate missing" }

          Compress-Archive -Path $root -DestinationPath "Visual-4k-$env:RELEASE_TAG.zip"
          Get-ChildItem -Recurse $root | Select-Object FullName

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Visual-4k ${{ inputs.release_tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: Visual-4k-*.zip
